name: 🐛 Bug Report
description: File a bug report to help us fix issues in DebateAI Landing Page.
title: "[BUG]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report an issue!
        Please search existing issues before submitting to avoid duplicates.
        For security issues, please see our [Security Policy](https://github.com/AOSSIE-Org/DebateAI-LandingPage/blob/main/SECURITY.md).
  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of what the bug is.
      placeholder: Describe the problem...
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: How can maintainers reproduce the issue?
      placeholder: |
        1. Go to '...'
        2. Click on '...'
        3. Scroll down to '...'
        4. See error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Browser, OS, Node.js version (if running locally).
      placeholder: "e.g., Chrome 124, Windows 11, Node 20.9"
    validations:
      required: false
